<body class="register">
    <!-- <h1>PENDAFTARAN ONLINE PELATIHAN</h1> -->
    <div class="container">
        <form action="#" method="post">
            <!-- Data Pribadi -->
            <div class="input-field">
                <label for="nik">NIK</label>
                <input type="text" name="nik" id="nik" maxlength="16"
                    oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');"
                    placeholder="NIK">
            </div>
            <div class="input-field">
                <label for="fullname">Nama Lengkap</label>
                <input type="text" name="fullname" id="fullname" placeholder="Nama Lengkap">
            </div>
            <div class="inline-input-field">
                <div class="input-field">
                    <label for="birthplace">Tempat Lahir</label>
                    <input type="text" name="birthplace" id="birthplace" placeholder="Tempat Lahir">
                </div>
                <div class="input-field">
                    <label for="birthdate">Tanggal Lahir</label>
                    <input type="date" name="birthdate" id="birthdate">
                </div>
            </div>
            <div class="inline-input-field">
                <div class="input-field">
                    <label for="">Jenis Kelamin</label>
                    <div class="inline-radio">
                        <input type="radio" name="gender" id="male" value="Pria">
                        <label for="male">Pria</label>
                        <input type="radio" name="gender" id="female" value="Wanita">
                        <label for="female">Wanita</label>
                    </div>
                </div>
                <div class="input-field">
                    <label for="">Status Pernikahan</label>
                    <div class="inline-radio">
                        <input type="radio" name="married" id="married" value="Menikah">
                        <label for="married">Menikah</label>
                        <input type="radio" name="married" id="single" value="Lajang">
                        <label for="single">Lajang</label>
                    </div>
                </div>
            </div>
            <div class="inline-input-field">
                <div class="input-field">
                    <label for="parent">Tinggi Badan</label>
                    <div class="inline-field">
                        <input type="text" name="height" id="height" maxlength="3" size="6"
                            placeholder="Tinggi Badan"><span class="unit">
                            cm</span>
                    </div>
                </div>
                <div class="input-field">
                    <label for="parent">Berat Badan</label>
                    <div class="inline-field">
                        <input type="text" name="weight" id="weight" maxlength="3" size="6"
                            placeholder="Berat Badan"><span class="unit">
                            kg</span>
                    </div>
                </div>
            </div>
            <div class="input-field">
                <label for="parent">Nama Orang Tua / Wali</label>
                <input type="text" name="parent" id="parent" placeholder="Orang Tua / Wali">
            </div>
