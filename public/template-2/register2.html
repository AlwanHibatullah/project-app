<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"
        defer></script>
    <title>Daftar Pelatihan | UPTD BLK Karawang</title>
</head>

<body>
    <div class="header-wrapper">
        <div class="container">
            <h1 class="text-center align-center">FORMULIR PENDAFTARAN ONLINE</h1>
        </div>
    </div>
    <div class="container-sm container-md">
        <form action="#">
            <div class="row g-3 my-2">
                <!-- Data Pribadi -->
                <div class="col-sm-12">
                    <label for="nik" class="form-label">NIK</label>
                    <input type="text" class="form-control" id="nik" placeholder="NIK">
                </div>
                <div class="col-sm-12">
                    <label for="fullname" class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Nama Lengkap">
                </div>
                <div class="col-lg-6 col-sm-12">
                    <label for="birthplace" class="form-label">Tempat Lahir</label>
                    <input type="text" class="form-control" id="birthplace" placeholder="Tempat Lahir">
                </div>
                <div class="col-lg-6 col-sm-12">
                    <label for="birthdate" class="form-label">Tanggal Lahir</label>
                    <input type="date" class="form-control" id="birthdate" placeholder="dd/mm/yyyy">
                </div>
                <div class="col-lg-6 col-sm-3">
                    <label for="gender" class="form-label">Jenis Kelamin</label>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="gender" id="male" value="Pria">
                        <label for="male" class="form-check-label">Pria</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="gender" id="female" value="Wanita">
                        <label for="female" class="form-check-label">Wanita</label>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-3">
                    <label for="m_status" class="form-label">Status Pernikahan</label>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="marry" id="married" value="Menikah">
                        <label for="married" class="form-check-label">Menikah</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" name="marry" id="single" value="Belum Menikah">
                        <label for="single" class="form-check-label">Belum Menikah</label>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-12">
                    <label for="height" class="form-label">Tinggi Badan</label>
                    <div class="row align-items-center">
                        <div class="col-4">
                            <input type="text" class="form-control" id="height" placeholder="Tinggi Badan (cm)">
                        </div>
                        <div class="col-3">
                            <span>cm</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 col-sm-12">
                    <label for="weight" class="form-label">Berat Badan</label>
                    <div class="row align-items-center">
                        <div class="col-4">
                            <input type="text" class="form-control" id="weight" placeholder="Berat Badan (kg)">
                        </div>
                        <div class="col-3">
                            <span>kg</span>
                        </div>
                    </div>
                </div>
                <div class="col-sm-12">
                    <label for="parent" class="form-label">Nama Orang Tua / Wali</label>
                    <input type="text" class="form-control" id="parent" placeholder="Nama Orang Tua / Wali">
                </div>
                <!-- end of Data Pribadi -->

                <!-- Kontak Pribadi -->
                <div class="col-lg-6 col-sm-12">
                    <label for="address" class="form-label">Alamat</label>
                    <textarea class="form-control no-resize" id="address" rows="5"
                        placeholder="Nama Jalan, No, RT/RW"></textarea>
                </div>
                <div class="col-lg-6 col-sm-12">
                    <div class="row g-4">
                        <div class="col-6">
                            <label for="province" class="form-label">Provinsi</label>
                            <input type="text" class="form-control" id="province" placeholder="Provinsi">
                        </div>
                        <div class="col-6">
                            <label for="city" class="form-label">Kabupaten/Kota</label>
                            <input type="text" class="form-control" id="city" placeholder="Kabupaten/Kota">
                        </div>
                        <div class="col-6">
                            <label for="district" class="form-label">Kecamatan</label>
                            <input type="text" class="form-control" id="district" placeholder="Kecamatan">
                        </div>
                        <div class="col-6">
                            <label for="vilage" class="form-label">Desa/Kelurahan</label>
                            <input type="text" class="form-control" id="vilage" placeholder="Desa/Kelurahan">
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <label for="phone" class="form-label">No. Telepon/HP</label>
                    <input type="text" class="form-control" id="phone" placeholder="No. Telepon/HP">
                </div>
                <div class="col-6">
                    <label for="phone2" class="form-label">No. Telepon/HP Wali</label>
                    <input type="text" class="form-control" id="phone2" placeholder="No. Telepon/HP Wali">
                </div>
                <!-- end of Kontak Pribadi -->

                <!-- Pendidikan Terakhir -->
                <!-- Bagian ini kalo bisa ngambil datanya dari database -->
                <div class="col-12">
                    <label for="education" class="form-label">Pendidikan Terakhir</label>
                    <select name="education" id="education" class="form-select" aria-label="Default select example">
                        <option selected>-- Silahkan Pilih Pendidikan Terakhir --</option>
                        <option value="Sekolah Dasar">SD</option>
                        <option value="Sekolah Menegah Pertama">SMP</option>
                        <option value="Sekolah Menengah Atas">SMA</option>
                        <option value="Sekolah Menengah Kejuruan">SMK</option>
                        <option value="Diploma 3">D3</option>
                        <option value="Strata 1">S1</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="row g-3">
                        <div class="col-6">
                            <label for="school_name" class="form-label">Nama Sekolah / Universitas</label>
                            <input type="text" class="form-control" id="school_name"
                                placeholder="Nama Sekolah / Universitas">
                        </div>
                        <div class="col-6">
                            <label for="graduate" class="form-label">Tahun Lulus</label>
                            <input type="text" class="form-control" id="graduate" placeholder="Tahun Lulus">
                        </div>
                        <div class="col-6">
                            <label for="consentration" class="form-label">Jurusan / Prodi</label>
                            <input type="text" class="form-control" id="consentration" placeholder="Jurusan / Prodi">
                        </div>
                        <div class="col-6">
                            <label for="final_score" class="form-label">Nilai Akhir / IPK</label>
                            <input type="text" class="form-control" id="final_score" placeholder="Nilai Akhir / IPK">
                        </div>
                    </div>
                </div>
                <!-- end of Pendidikan Terakhir -->

                <!-- Kejuruan -->
                <!-- Bagian ini juga sama, kalo bisa ngambil datanya dari database -->
                <div class="col-12">
                    <label for="interest" class="form-label">Kejuruan Yang Akan Dipilih</label>
                    <select name="interest" id="interest" class="form-select" aria-label="select-interest">
                        <option selected>-- Silahkan Pilih Kejuruan Sesuai Minat Anda --</option>
                        <option value="Teknik Manufaktur">Teknik Manufaktur</option>
                        <option value="Teknik Las">Teknik Las</option>
                        <option value="Teknik Listrik">Teknik Listrik</option>
                        <option value="Teknik Otomotif">Teknik Otomotif</option>
                        <option value="Teknik Elektronika">Teknik Elektronika</option>
                        <option value="Bisnis dan Manajemen">Bisnis dan Manajemen</option>
                        <option value="Garmen Apparel">Garmen Apparel</option>
                        <option value="Tata Kecantikan">Tata Kecantikan</option>
                        <option value="Teknologi Informasi">Teknologi Informasi</option>
                        <option value="Alat Pendingin AC">Alat Pendingin AC</option>
                        <option value="Barista dan Pastry">Barista dan Pastry</option>
                    </select>
                </div>
                <!-- end of Kejuruan -->
            </div>
            <button type="submit" class="btn btn-primary">Kirim Data</button>
        </form>
    </div>
</body>

</html>
